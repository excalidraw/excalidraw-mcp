apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: excalidraw-mcp
  namespace: excalidraw-mcp
  annotations:
    cert-manager.io/cluster-issuer: letsencrypt-prod
spec:
  ingressClassName: nginx
  tls:
    - hosts:
        - excalidraw-mcp.sitesoftllc.net
      secretName: excalidraw-mcp-tls
  rules:
    - host: excalidraw-mcp.sitesoftllc.net
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: excalidraw-mcp
                port:
                  number: 80
